<script>
const data = [
    {
        title: "افغانستان",
        category: "جغرافیا",
        text: "افغانستان کشوری در قلب آسیا است و پایتخت آن کابل می‌باشد."
    },
    {

    },
    {
        title: "هرات",
        category: "ولایت‌ها",
        text: "هرات یکی از شهرهای تاریخی افغانستان است و در زمینه فرهنگ، هنر و ادبیات شهرت دارد."
    },
    {
        title: "بلخ",
        category: "ولایت‌ها",
        text: "بلخ یکی از مناطق تاریخی مهم افغانستان است و شهر باستانی بلخ در آن قرار دارد."
    },
    {
        title: "قندهار",
        category: "ولایت‌ها",
        text: "قندهار یکی از شهرهای مهم تاریخی و فرهنگی جنوب افغانستان است."
    },
    {
        title: "بامیان",
        category: "ولایت‌ها",
        text: "بامیان به دلیل طبیعت زیبا، دره بامیان و آثار تاریخی خود شناخته می‌شود."
    },
    {
        title: "غزنی",
        category: "تاریخ",
        text: "غزنی در تاریخ افغانستان و منطقه اهمیت فرهنگی و تاریخی زیادی داشته است."
    },
    {
        title: "تاریخ افغانستان",
        category: "تاریخ",
        text: "افغانستان دارای تاریخ طولانی و سرشار از تمدن‌ها، حکومت‌ها و رویدادهای مهم است."
    },
    {
        title: "فرهنگ افغانستان",
        category: "فرهنگ",
        text: "فرهنگ افغانستان شامل زبان‌ها، ادبیات، موسیقی، لباس‌های سنتی، غذاها و رسوم گوناگون است."
    },
    {
        title: "ادبیات افغانستان",
        category: "ادبیات",
        text: "شعر و ادبیات فارسی دری و زبان‌های دیگر بخش مهمی از میراث فرهنگی افغانستان هستند."
    },
    {
        title: "غذاهای سنتی",
        category: "فرهنگ",
        text: "قابلی پلو، منتو، آشک و غذاهای محلی از غذاهای شناخته‌شده افغانستان هستند."
    }
];

function searchSite() {

    const input = document.getElementById("searchInput");
    const query = input.value.trim().toLowerCase();

    if (query === "") {
        alert("لطفاً یک موضوع برای جست‌وجو بنویسید.");
        return;
    }

    const results = data.filter(item =>
        item.title.toLowerCase().includes(query) ||
        item.category.toLowerCase().includes(query) ||
        item.text.toLowerCase().includes(query)
    );

    showSearchResults(results, query);
}

function showSearchResults(results, query) {

    const modal = document.getElementById("modal");
    const title = document.getElementById("modalTitle");
    const text = document.getElementById("modalText");

    if (results.length === 0) {

        title.textContent = "نتیجه‌ای پیدا نشد 🔍";

        text.innerHTML = `
            برای <b>«${query}»</b> معلوماتی در افغانستان‌نامه پیدا نشد.
            <br><br>
            نام ولایت، تاریخ، فرهنگ یا موضوع دیگری را امتحان کنید.
        `;

    } else {

        title.textContent =
            "نتایج جست‌وجو 🔎";

        text.innerHTML = results.map((item, index) => `
            <div style="
                background: rgba(8,116,67,.08);
                padding:15px;
                margin:10px 0;
                border-radius:12px;
                cursor:pointer;
            "
            onclick="showResult(${index})">

                <strong>${item.title}</strong>
                <br>

                <small>${item.category}</small>

                <p>${item.text}</p>

            </div>
        `).join("");

        window.searchResults = results;
    }

    modal.classList.add("active");
}

function showResult(index) {

    const item = window.searchResults[index];

    document.getElementById("modalTitle").textContent =
        item.title;

    document.getElementById("modalText").innerHTML = `
        <p><strong>دسته:</strong> ${item.category}</p>
        <br>
        <p>${item.text}</p>
    `;
}

function closeModal() {
    document.getElementById("modal").classList.remove("active");
}

function toggleDark() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );
}

if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
}

document
    .getElementById("searchInput")
    .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
            searchSite();
        }

    });

document
    .getElementById("modal")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeModal();
        }

    });
      </script>
